<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PickleBall Scores App</title>
        <link rel="stylesheet" type="text/css" href="./materialize.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="./style.css">
        <script type="text/javascript" src="./materialize.min.js"></script>
        <link rel="manifest" href="./manifest.json">
        <link rel="apple-touch-icon" href="./icon-192.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Pickle Score">
        <meta name="apple-mobile-web-app-status-bar" content="#90ba3d">
    </head>
    <body class="blue-grey lighten-4">
        <!-- top nav -->
        <nav class="z-depth-0">
            <div class="nav-wrapper container">
                <a href="#" class="brand-logo">Pickle Score</a>
                <span class="right white-text text-darken-1">
                    <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
                </span>
            </div>
        </nav>
        <!-- side nav -->
        <ul id="side-menu" class="sidenav side-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Tournaments</a></li>
            <li><a href="#">Scores</a></li>
            <li><a href="#">Standings</a></li>
        </ul>

        <div class="container grey-text text-darken-1">
            <nav><p>container</p></nav>
            <div class="card-panel tournamentDiv white row">
                <nav><p>Tournament</p></nav>
            </div>
            <div class="card-panel scoreBoardDiv white row">
                <nav><p>ScoreBoard</p></nav>
            </div>
            <div class="card-panel standingsTableDiv white row">
                <nav><p>Standings</p></nav>
            </div>
        </div>

        <div class="recipes container grey-text text-darken-1">
            <div class="card-panel recipe white row">
                <img src="/img/dish.png" alt="recipe thumb">
                <div class="recipe-details">
                    <div class="recipe-title">title</div>
                    <div class="recipe-ingredients">text</div>
                </div>
                <div class="recipe-delete">
                    <i class="material-icons">delete_outline</i>
                </div>
            </div>
            <div class="card-panel recipe white row">
                <img src="/img/dish.png" alt="recipe thumb">
                <div class="recipe-details">
                    <div class="recipe-title">Title</div>
                    <div class="recipe-ingredients">text</div>
                </div>
                <div class="recipe-delete">
                    <i class="material-icons">delete_outline</i>
                </div>
            </div>
        </div>

        <div class="center">
    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- add recipe side nav -->
  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6 >New Recipe</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="e.g. Ninja soup" id="title" type="text" class="validate">
        <label for="title">Recipe Title</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
        <label for="ingredients">Ingredients</label>
      </div>
      <div class="input-field center">
        <button class="btn-small">Add</button>
      </div>
    </form>
  </div>
        <!--
        -->


        <script src="./script.js"></script>
    </body>
</html>
